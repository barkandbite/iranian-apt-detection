name: Validate rules

# Every gate here corresponds to a defect class that actually reached HEAD.
# Two caused total detection outages:
#   - Suricata v4.0.21: dsize:>500000 (uint16 overflow) + http.host+nocase
#     hard error took all 429 rules offline for 26 days.
#   - Wazuh: level="17" and same_src_ip made analysisd refuse to start,
#     taking the entire SIEM ruleset offline. xmllint passed throughout.
#
# Both engines are therefore BLOCKING gates. XML well-formedness is necessary
# but nowhere near sufficient: Wazuh's OS_XML parser is stricter than standard
# XML (no CDATA) and analysisd rejects constructs no XML parser sees.

on:
  pull_request:
    paths:
      - 'suricata/**'
      - 'wazuh-rules/**'
      - 'configurations/**'
      - 'cdb-lists/**'
      - 'tools/lint-rules.py'
      - '.github/workflows/validate-rules.yml'
  push:
    branches: [main]
    paths:
      - 'suricata/**'
      - 'wazuh-rules/**'
      - 'configurations/**'
      - 'cdb-lists/**'
  workflow_dispatch:

jobs:
  static-lint:
    name: Static lint (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: XML well-formedness
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libxml2-utils
          xmllint --noout wazuh-rules/*.xml
          echo "XML well-formed (necessary, NOT sufficient - see analysisd job)"

      - name: Ruleset linter
        run: python3 tools/lint-rules.py

      - name: CDB lists in sync with Suricata ruleset
        run: python3 tools/extract-iocs.py --check

  suricata-load:
    name: Suricata load test (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Suricata 7
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq suricata
          suricata -V

      - name: Load every Suricata rule file
        run: |
          mkdir -p /tmp/suri
          fail=0
          for f in suricata/*.rules; do
            [ -f "$f" ] || continue
            echo "=== $f ==="
            suricata -T -S "$f" -l /tmp/suri 2>&1 | tee /tmp/out
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ] || grep -qE '^E:|Loading signatures failed' /tmp/out; then
              echo "::error file=$f::Suricata refused to load this file"
              fail=1
            fi
          done
          exit $fail

      - name: Duplicate SID check
        run: |
          dupes=$(grep -hoP '\bsid:\d+' suricata/*.rules | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::duplicate SIDs (silent rule override): $dupes"
            exit 1
          fi
          echo "no duplicate SIDs"

  wazuh-load:
    name: Wazuh analysisd load test (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOTE: deliberately NOT a `container: wazuh/wazuh-manager` job.
      # That image populates /var/ossec/etc at ENTRYPOINT, and GitHub Actions
      # container jobs replace the entrypoint, so the init never runs and
      # analysisd dies on a missing etc/internal_options.conf before it ever
      # reads a rule. Installing the package gives a fully provisioned
      # /var/ossec, which is what the rules actually need.
      - name: Install Wazuh manager
        run: |
          set -e
          curl -sSL https://packages.wazuh.com/key/GPG-KEY-WAZUH \
            | sudo gpg --no-default-keyring \
                --keyring gnupg-ring:/usr/share/keyrings/wazuh.gpg --import
          sudo chmod 644 /usr/share/keyrings/wazuh.gpg
          echo "deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main" \
            | sudo tee /etc/apt/sources.list.d/wazuh.list
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq wazuh-manager
          dpkg -l wazuh-manager | tail -1

      - name: Load ruleset into analysisd
        run: |
          set -e
          sudo cp wazuh-rules/09*.xml /var/ossec/etc/rules/
          sudo chown wazuh:wazuh /var/ossec/etc/rules/09*.xml || true

          # CDB lists must be BOTH copied and declared in ossec.conf, or
          # analysisd warns "List could not be loaded" and silently ignores
          # every rule that references them.
          sudo mkdir -p /var/ossec/etc/lists
          decl=""
          for f in cdb-lists/*; do
            if [ -f "$f" ] && [ "$(basename "$f")" != "README.md" ]; then
              sudo cp "$f" /var/ossec/etc/lists/
              decl="$decl    <list>etc/lists/$(basename "$f")</list>\n"
            fi
          done
          sudo chown -R wazuh:wazuh /var/ossec/etc/lists || true
          sudo sed -i "s|<list>etc/lists/audit-keys</list>|$decl    <list>etc/lists/audit-keys</list>|" \
            /var/ossec/etc/ossec.conf

          echo "=== wazuh-analysisd -t ==="
          out=$(sudo /var/ossec/bin/wazuh-analysisd -t 2>&1 || true)
          echo "$out"

          # Hard failures: analysisd refuses to start, whole ruleset offline.
          # "resource limit" is an unprivileged-runner warning, not a defect.
          if echo "$out" | grep -iE 'ERROR|CRITICAL' | grep -qv 'resource limit'; then
            echo "::error::analysisd rejected the ruleset - it would refuse to start"
            exit 1
          fi

          # Silent failures: the file loads but individual rules never fire.
          # These are the failure mode this whole ruleset exists to avoid, so
          # they are blocking too.
          if echo "$out" | grep -q 'deprecated field option'; then
            echo "::error::a rule uses a deprecated option that analysisd ignores"
            exit 1
          fi
          if echo "$out" | grep -q 'could not be loaded'; then
            echo "::error::a CDB list failed to load - rules referencing it are ignored"
            exit 1
          fi

          # Group-not-found depends on which decoders/integrations a deployment
          # runs, so it is reported but not blocking.
          ignored=$(echo "$out" | grep -c 'will be ignored' || true)
          echo "rules ignored (deployment-dependent groups): $ignored"
          echo "$out" | grep 'will be ignored' || true

          echo "analysisd accepted all rule files"
